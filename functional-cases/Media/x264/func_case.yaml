# x264 功能测试清单。
# 独立于性能测试框架 software/Media/x264 的 x264_test.sh;版本由人工指定,不做 latest 解析。
name: x264
category: Media
enabled: true

# 人工指定的待测版本:与性能用例 software/Media/x264/case.yaml 保持一致。
versions:
  - "0.165.3223"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  # 分层获取:上游无二进制、仓库包滞后,最终以源码构建 + checkasm,较重,给足时间。
  timeout_minutes: 120

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 判定来源:优先复用上游 checkasm,叠加编码 smoke。
checks:
  - name: version
    description: x264 --version 的版本号必须等于请求版本
  # 上游 checkasm 汇编一致性测试,需要 install 阶段准备好的源码树(目录内必须含 configure 与 Makefile)。
  # build 模式用本次克隆并构建的源码目录;prebuilt 模式浅克隆上游源码并 configure。
  - name: upstream-test
    description: 运行上游 checkasm 汇编一致性测试
    upstream_command: make checkasm
  - name: encode-smoke
    description: 生成裸 YUV 并用 x264 CLI 编码成码流,校验码流含 NAL 起始码

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  check_log:
    path: check.log
    stage: check
    format: text
    required: true
# openjdk (OpenJDK) 功能测试清单。
# 独立于性能测试框架 framework/;版本由人工指定,不做 latest 解析。
name: openjdk
category: Toolchain
enabled: true

# 人工指定的待测版本(白名单)。此处填 JDK 的 feature version(如 21/25/28):
# OpenJDK 的 java -version 对 GA 版输出 "21.0.9"、对 EA 版输出 "28-ea",
# 只有 feature 号是跨 GA/EA 稳定且可比的标识,故版本校验按 feature 号比对。
versions:
  - "28"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 90

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 判定来源:优先复用上游测试套件(upstream_command),不足时用内部 smoke 补齐。
# build 模式(FUNC_MODE=build,ubuntu 官方基础镜像内)按分层优先获取 JDK,每层都须匹配请求
# feature 号,不匹配即降级:
#   层1 上游官方二进制 = jdk.java.net 发布的 OpenJDK 二进制(GA 与 EA 都在此页,附 .sha256)
#   → 层2 三方仓库包 = Adoptium Temurin 的版本化下载 API
#   → 层3 源码编译 = 需引导 JDK 且耗时数小时,功能测试的 build 模式内结构性不可用。
checks:
  - name: version
    description: java -version 的 feature 号必须等于请求版本
  # JDK 自带测试依赖 jtreg 且耗时过长,改用 javac 编译 + java 运行的功能测试。
  - name: upstream-test
    description: javac 编译并 java 运行一个 Hello 程序
    upstream_command: javac Hello.java && java Hello
  - name: smoke
    description: java 运行一个使用 java.util.stream 的程序

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  check_log:
    path: check.log
    stage: check
    format: text
    required: true

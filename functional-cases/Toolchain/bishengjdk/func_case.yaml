# bishengjdk (毕昇 JDK) 功能测试清单。
# 独立于性能测试框架 framework/;版本由人工指定,不做 latest 解析。
name: bishengjdk
category: Toolchain
enabled: true

# 人工指定的待测版本(白名单),与 software/Toolchain/bishengjdk/case.yaml 一致。
versions:
  - "21.0.9"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 60

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 判定来源:优先复用上游测试套件(upstream_command),不足时用内部 smoke 补齐。
# build 模式(FUNC_MODE=build,ubuntu 官方基础镜像内)按分层优先获取毕昇 JDK,每层版本需严格等于
# SOFTWARE_VERSION,不匹配则降级:层1 华为云官方镜像 aarch64/x64 tarball →
# 层2 三方仓库包(distribution.yaml 未声明任何三方渠道,结构性不可用)→
# 层3 毕昇 GA 源码 + Adoptium Temurin 引导 JDK 编译。
checks:
  - name: version
    description: 获取到的 JDK 版本必须等于请求版本(java -version,层1/2/3 任一来源均须匹配)
  # JDK 自带测试依赖 jtreg 且耗时过长,改用 javac 编译 + java 运行的功能测试。
  - name: upstream-test
    description: javac 编译并 java 运行一个 Hello 程序
    upstream_command: javac Hello.java && java Hello
  - name: smoke
    description: java 运行一个使用 java.util.stream 的程序

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  check_log:
    path: check.log
    stage: check
    format: text
    required: true
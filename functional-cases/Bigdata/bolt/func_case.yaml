# ⚠ 版本为推断,需人工确认。
# 上游 bytedance/bolt 目前不发布任何 GitHub release / tag(仓库 default_branch=main,
# README 说明默认 BUILD_VERSION=main),故此处以 main 分支作为待测版本,
# 版本校验改用 git ref / commit。若后续上游发布正式 tag,请替换 versions 并改用 tag 校验。
#
# Bolt(字节跳动 C++ 原生执行引擎,经 Apache Gluten 作为 Spark 后端集成)功能测试清单。
name: bolt
category: Bigdata
enabled: true

# 人工指定的待测版本(白名单):上游当前仅以 main 分支分发。
versions:
  - "main"

# build 模式(FUNC_MODE=build)软件获取为分层优先:1) 上游官方二进制 2) 三方仓库包 3) 源码编译。
# Bolt 官方仅有源码(无二进制/镜像),层1/层2 无可用渠道,实际走层3(Conan+CMake 重构建);
# 版本校验以 git ref 为基准。

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  # Bolt 首次构建会用 Conan 从源码编译全部依赖(LLVM/Arrow 等),非常重。
  timeout_minutes: 300

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 判定来源:优先复用上游自带 gtest 单测子集;不可行时退化为构建产物链接冒烟。
checks:
  - name: version
    description: 校验源码 ref / 镜像内 BUILD_VERSION 等于请求版本(git ref)
  - name: upstream-unit-test
    description: 运行上游自带 gtest 单测子集(ctest -R 过滤)
    upstream_command: ctest -R bolt_ --output-on-failure
  - name: link-smoke
    description: 最小可用性冒烟,校验构建产物 libbolt*.so 可被动态链接器加载

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  test_log:
    path: bolt_test.log
    stage: check
    format: text
    required: true
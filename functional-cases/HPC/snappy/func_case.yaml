# Snappy 功能测试清单。
# 独立于性能测试框架;版本由人工指定,不做 latest 解析。
name: snappy
category: HPC
enabled: true

# 人工指定的待测版本(白名单),与 software/HPC/snappy/case.yaml 保持一致。
versions:
  - "1.2.2"
  - "1.1.7"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 30

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
checks:
  - name: version
    description: 构建产物的 Snappy 版本必须等于请求版本
  # Snappy 是纯库(无 CLI):上游自带 snappy_unittest,由 CMake 以 ctest 目标注册。
  # install 阶段克隆源码(含 googletest 子模块)并以 SNAPPY_BUILD_TESTS=ON 构建该测试可执行文件。
  - name: upstream-test
    description: 运行上游 snappy_unittest 单元测试
    upstream_command: ./build/snappy_unittest
  - name: roundtrip
    description: 链接 libsnappy 的 C++ 程序做 Compress/Uncompress 回环校验

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  snappy_test_log:
    path: snappy_test.log
    stage: check
    format: text
    required: true
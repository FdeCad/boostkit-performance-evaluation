# scann 功能测试清单。
# 独立于性能测试框架 software/AI/scann/;版本由人工指定,不做 latest 解析。
name: scann
category: AI
enabled: true

# 人工指定的待测版本(白名单),与 software/AI/scann/case.yaml 保持一致。
versions:
  - "1.4.0"
  - "1.2.10"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 60
  # arm64 无 wheel,回退源码编译。
  min_free_disk_gb: 6

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 判定来源:版本校验 + 两个基于官方 scann_ops_pybind 索引构建 API 的功能 smoke。
# build 模式分层优先获取(上游官方 wheel→三方仓库→源码编译),每层校验版本严格相等;
# 官方仅发布 x86_64 manylinux wheel(arm64_binary: no),aarch64 上游/三方均无该精确版本产物,
# 此时"源码编译"是唯一可行层。
checks:
  - name: version
    description: 已安装 scann 版本必须等于请求版本
  - name: scann-dot-product
    description: dot_product 距离建索引并检索,校验返回形状与邻居合法性
  - name: scann-squared-l2
    description: squared_l2 距离建索引并检索,校验返回形状与距离升序

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  functional_log:
    path: functional_test.log
    stage: check
    format: text
    required: true
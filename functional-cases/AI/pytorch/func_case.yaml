# pytorch 功能测试清单。
# 独立于性能测试框架 software/AI/pytorch/;版本由人工指定,不做 latest 解析。
name: pytorch
category: AI
enabled: true

# 人工指定的待测版本(白名单),与 software/AI/pytorch/case.yaml 保持一致。
versions:
  - "2.14.1"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 120
  # 层 3 会克隆 pytorch 源码(含子模块)并现场编译 wheel,峰值远超框架默认值。
  min_free_disk_gb: 25

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 判定来源:版本校验 + 两个基于官方 torch 算子的功能 smoke。
# build 模式分层优先获取(官方 CPU wheel→三方 PyPI→源码编译),每层校验版本(裁 +cpu 后)严格相等;
# 官方 CPU wheel 不随附上游测试树,这里用确定性的算子回环替代上游套件。
checks:
  - name: version
    description: 已安装 torch 版本(裁掉 +cpu 后缀)必须等于请求版本
  - name: matmul-autograd
    description: 张量矩阵乘 + autograd 反向回环,校验梯度与解析解一致
  - name: nn-training-loop
    description: 小型全连接网络 SGD 训练回环,校验损失下降

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  functional_log:
    path: functional_test.log
    stage: check
    format: text
    required: true
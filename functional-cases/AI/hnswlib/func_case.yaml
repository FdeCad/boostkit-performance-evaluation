# hnswlib 功能测试清单。
# 独立于性能测试框架 software/AI/hnswlib/;版本由人工指定,不做 latest 解析。
name: hnswlib
category: AI
enabled: true

# 人工指定的待测版本(白名单),与 software/AI/hnswlib/case.yaml 保持一致。
versions:
  - "0.8.0"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  timeout_minutes: 60

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# 判定来源:版本校验 + 两个基于官方 hnswlib Python 绑定的功能 smoke。
# build 模式分层优先获取(上游官方二进制→三方仓库→源码编译),每层校验版本严格相等;
# hnswlib 官方仓库的 C++ 基准依赖 sra_test,功能层改用其公开 Python API 的确定性回环。
checks:
  - name: version
    description: 已安装 hnswlib 版本必须等于请求版本
  - name: hnsw-knn-roundtrip
    description: 建索引 add_items 后 knn_query 回环,校验结果形状与自查询召回
  - name: hnsw-filter
    description: 带 filter 谓词的 knn_query,校验过滤结果全部满足谓词

outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  functional_log:
    path: functional_test.log
    stage: check
    format: text
    required: true
# OceanBase 功能测试清单。
# 独立于性能测试框架 framework/;版本由人工指定,不做 latest 解析。
name: oceanbase
category: Database
enabled: true

# 人工指定的待测版本(白名单),与 software/Database/oceanbase/case.yaml 保持一致。
versions:
  - "5.0.1.0"

execution:
  type: shell-functions
  stages:
    prepare:
      script: build.sh
      function: func_prepare
    install:
      script: build.sh
      function: func_install
    check:
      script: test.sh
      function: func_check
    cleanup:
      script: test.sh
      function: func_cleanup
  # 分层获取(官方二进制 obd 拉包 → 三方仓库 → 源码编译)+ 最小可用性验证,90 分钟足够。
  timeout_minutes: 90
  # 经 obd 拉取并部署 observer,下载与部署产物较大。
  min_free_disk_gb: 10

# 功能判定项,名称与 functional_result.json 中 checks[].name 一一对应。
# OceanBase 为部署服务型软件、集群较重,无轻量自带测试套件:
# 采用官方部署工具 obd 拉起最小集群,再以 mysql 协议做最小可用性 + 功能验证。
checks:
  - name: version
    description: observer 的 SELECT version() 必须等于请求版本
  # 上游 sysbench 是 OceanBase 官方基准所用的负载工具,作为只读点查烟测。
  - name: upstream-test
    description: 使用上游 sysbench 对 observer 执行 oltp_point_select 点查烟测
    upstream_command: sysbench oltp_point_select --tables=1 --table-size=1000 run
  - name: sql-roundtrip
    description: 建库建表,INSERT/SELECT 回环校验
outputs:
  functional_result:
    path: functional_result.json
    stage: check
    format: json
    required: true
  upstream_test_log:
    path: upstream_test.log
    stage: check
    format: text
    required: true